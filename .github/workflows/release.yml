name: Release macOS App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v (e.g. 1.0.2)"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install libwebp
        run: brew install webp

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            RAW_VER="${{ github.event.inputs.version }}"
          else
            RAW_VER="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$RAW_VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$RAW_VER" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          DEV_DIR="$(xcode-select -p)"
          PLUG="$DEV_DIR/usr/lib/swift/host/plugins/testing/libTestingMacros.dylib"
          if [[ -f "$PLUG" ]]; then
            swift test -Xswiftc -load-plugin-library -Xswiftc "$PLUG"
          else
            swift test
          fi

      - name: Build .app bundle and DMG / ZIP installers
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          SKIP_FINDER_LAYOUT: "1"
        run: |
          chmod +x scripts/build_app.sh scripts/create_dmg.sh
          ./scripts/build_app.sh
          ./scripts/create_dmg.sh
          ditto -c -k --sequesterRsrc --keepParent dist/SnapFeather.app "dist/SnapFeather-${{ steps.version.outputs.tag }}-arm64.zip"
          (
            cd dist
            shasum -a 256 "SnapFeather-${{ steps.version.outputs.tag }}-arm64.dmg" "SnapFeather-${{ steps.version.outputs.tag }}-arm64.zip" > SHA256SUMS.txt
          )

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: SnapFeather ${{ steps.version.outputs.tag }}
          body: |
            ## Easy Install (macOS Apple Silicon `arm64`, macOS 14+)
            1. Download **`SnapFeather-${{ steps.version.outputs.tag }}-arm64.dmg`**.
            2. Open the `.dmg` and drag **`SnapFeather.app`** onto the **`Applications`** folder shortcut.
            3. On first launch, if macOS Gatekeeper warns that the app is unverified, open **System Settings → Privacy & Security → Open Anyway** (or run `xattr -cr /Applications/SnapFeather.app && open /Applications/SnapFeather.app`).
            4. Look for the camera viewfinder icon in your **top menu bar** (or press `⌘⇧2`) and grant **Screen Recording** permission when prompted.
          files: |
            dist/SnapFeather-${{ steps.version.outputs.tag }}-arm64.dmg
            dist/SnapFeather-${{ steps.version.outputs.tag }}-arm64.zip
            dist/SHA256SUMS.txt
